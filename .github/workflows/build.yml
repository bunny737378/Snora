name: Build SNORA APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SNORA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download FFmpeg, Snora and MPV Headers
        run: |
          mkdir -p player/src/main/jniLibs/arm64-v8a player/src/main/jniLibs/armeabi-v7a
          mkdir -p player/src/main/cpp/include/mpv app/src/main/cpp/include

          echo "Ensuring mpv headers exist..."
          if [ ! -f "player/src/main/cpp/include/mpv/client.h" ]; then
            curl -s https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/client.h -o player/src/main/cpp/include/mpv/client.h
            curl -s https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render.h -o player/src/main/cpp/include/mpv/render.h
            curl -s https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render_gl.h -o player/src/main/cpp/include/mpv/render_gl.h
          fi

          echo "Downloading FFmpeg and Snora native release from Newffmmmmm..."
          mkdir -p /tmp/ffmpeg_ci
          curl -L -s https://github.com/bunny737378/Newffmmmmm/releases/download/ffmpeg-android-latest/ffmpeg.zip -o /tmp/ffmpeg_ci/ffmpeg.zip
          unzip -q /tmp/ffmpeg_ci/ffmpeg.zip -d /tmp/ffmpeg_ci_unpacked

          cp -v /tmp/ffmpeg_ci_unpacked/lib/arm64-v8a/*.so player/src/main/jniLibs/arm64-v8a/
          cp -v /tmp/ffmpeg_ci_unpacked/lib/armeabi-v7a/*.so player/src/main/jniLibs/armeabi-v7a/
          cp -r /tmp/ffmpeg_ci_unpacked/include/arm64-v8a/* player/src/main/cpp/include/
          cp -r /tmp/ffmpeg_ci_unpacked/include/arm64-v8a/* app/src/main/cpp/include/ || true

          if [ ! -f "player/src/main/jniLibs/arm64-v8a/libc++_shared.so" ]; then
            echo "Downloading Android NDK libc++_shared runtime..."
            mkdir -p /tmp/ndk_ci
            curl -L -s https://github.com/mpv-android/mpv-android/releases/download/2026-09-17/app-default-universal-release.apk -o /tmp/ndk_ci/mpv.apk
            unzip -j -q /tmp/ndk_ci/mpv.apk "lib/arm64-v8a/libc++_shared.so" -d player/src/main/jniLibs/arm64-v8a/
            unzip -j -q /tmp/ndk_ci/mpv.apk "lib/armeabi-v7a/libc++_shared.so" -d player/src/main/jniLibs/armeabi-v7a/
          fi

          echo "Native libraries and headers verified:"
          ls -lh player/src/main/jniLibs/arm64-v8a/
          ls -la player/src/main/cpp/include/mpv/

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" output/SNORA.apk
          cp "$APK_PATH" SNORA.apk
          echo "Output APK size:"
          ls -lh output/SNORA.apk

      - name: Upload SNORA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNORA-apk
          path: output/SNORA.apk
          retention-days: 30
